
name: Build THE VOID APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

          

      - name: Extract Android project
        run: |
          unzip -q THE_VOID_Android_v1_1_source.zip -d extracted
          test -f extracted/THE_VOID_Android_v1_1/settings.gradle.kts

      
      - name: Fix Java compilation error
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/THE_VOID_Android_v1_1/app/src/main/java/com/thevoid/ambient/MainActivity.java")
          s = p.read_text()
          old = "Uri[] result = result == RESULT_OK"
          new = "Uri[] result = resultCode == RESULT_OK"
          if old not in s:
              raise SystemExit("Expected Java error not found")
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: extracted/THE_VOID_Android_v1_1
        run: gradle --no-daemon assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-VOID-Android-APK
          path: extracted/THE_VOID_Android_v1_1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

