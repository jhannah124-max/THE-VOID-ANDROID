
name: Build THE VOID APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q THE_VOID_Android_v1_1_source.zip -d extracted
          test -f extracted/THE_VOID_Android_v1_1/settings.gradle.kts

      - name: Build debug APK
        working-directory: extracted/THE_VOID_Android_v1_1
        run: gradle --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: THE-VOID-Android-APK
          path: extracted/THE_VOID_Android_v1_1/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
